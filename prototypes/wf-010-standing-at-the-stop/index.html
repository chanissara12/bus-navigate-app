<!DOCTYPE html>
<!--
  PROTOTYPE — WF-010 "หน้าจอ ยืนอยู่ที่ป้าย" — ใช้แล้วทิ้ง ไม่ใช่โค้ดชุดแรกของแอปจริง
  3 variant สลับด้วย ?variant=A|B|C หรือปุ่มลูกศรที่แถบล่าง (คีย์บอร์ด ← →)
  ข้อมูลจริงจากฟีด Namtang 20260919 — ยืนที่ อนุสาวรีย์ชัยสมรภูมิ (เกาะพญาไท) จะไป สยามสแควร์
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WF-010 ยืนอยู่ที่ป้าย</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#272c36; --fg:#f2f4f8; --dim:#9aa3b2;
    --yes:#25c26e; --yes-d:#0d3d24; --no:#ef4a5c; --no-d:#3d1218; --warn:#f0b429;
    --accent:#4c9aff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#05070a;color:var(--fg);
    font-family:"Noto Sans Thai","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  #phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
    padding-bottom:96px;position:relative}
  .bar{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;
    background:var(--bg);z-index:5}
  .bar .from{font-size:12px;color:var(--dim);letter-spacing:.02em}
  .bar .stop{font-size:19px;font-weight:700;margin-top:2px;line-height:1.25}
  .bar .to{margin-top:9px;font-size:13px;color:var(--dim)}
  .bar .to b{color:var(--accent);font-size:15px}
  .wrap{padding:14px 16px}
  .note{margin:16px;padding:11px 13px;border:1px dashed #3a3f4b;border-radius:10px;
    color:var(--dim);font-size:12px;line-height:1.6}
  .note b{color:var(--warn)}
  h3.sec{font-size:12px;color:var(--dim);margin:20px 0 9px;letter-spacing:.06em;font-weight:600}

  /* ---------- Variant A : รายการเลขสายที่ถือรอ ---------- */
  .rowA{display:flex;gap:14px;align-items:center;background:var(--card);
    border:1px solid var(--line);border-left:5px solid var(--yes);
    border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .rowA.miss{border-left-color:#3a3f4b;opacity:.55}
  .numA{font-size:29px;font-weight:800;line-height:1;letter-spacing:-.03em;
    min-width:94px;font-variant-numeric:tabular-nums}
  .numA small{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:4px}
  .metaA{flex:1;min-width:0}
  .headA{font-size:15px;font-weight:600;line-height:1.3}
  .headA::before{content:"หน้ารถเขียนว่า";display:block;font-weight:400;color:var(--dim);
    font-size:11px;margin-bottom:2px}
  .subA{font-size:12.5px;color:var(--dim);margin-top:5px}
  .subA b{color:var(--yes)}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--accent);font-size:13px;padding:10px 0}

  /* ---------- Variant B : แป้นกดเลขสาย ---------- */
  .screenB{height:250px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:18px;margin:14px 16px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);transition:background .12s}
  .screenB.yes{background:var(--yes-d);border-color:var(--yes)}
  .screenB.no{background:var(--no-d);border-color:var(--no)}
  .typed{font-size:46px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;
    min-height:56px}
  .typed .ph{color:#39404d}
  .verdict{font-size:23px;font-weight:800;margin-top:10px}
  .verdict.y{color:var(--yes)} .verdict.n{color:var(--no)} .verdict.u{color:var(--dim)}
  .detail{font-size:14px;color:var(--fg);margin-top:9px;line-height:1.55}
  .detail .d{color:var(--dim)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px}
  .key{background:var(--card);border:1px solid var(--line);border-radius:12px;
    font-size:25px;font-weight:700;color:var(--fg);padding:16px 0;cursor:pointer;
    font-family:inherit;font-variant-numeric:tabular-nums}
  .key:active{background:#242935}
  .key.alt{font-size:15px;color:var(--dim)}
  .hintB{text-align:center;color:var(--dim);font-size:12px;padding:14px 26px 0;line-height:1.6}

  /* ---------- Variant C : แถบเส้นทาง ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:9px 15px;font-size:15px;font-weight:700;color:var(--dim);cursor:pointer;
    font-family:inherit;white-space:nowrap}
  .chip.ok{color:var(--fg);border-color:#2f6f4b}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#04101f}
  .cHead{padding:14px 16px 4px}
  .cHead .big{font-size:29px;font-weight:800;line-height:1.1}
  .cHead .hs{font-size:14px;color:var(--dim);margin-top:6px}
  .cHead .hs b{color:var(--fg)}
  .strip{padding:10px 16px 0}
  .st{display:flex;gap:13px;align-items:flex-start;min-height:42px}
  .rail{width:14px;display:flex;flex-direction:column;align-items:center;flex:0 0 14px}
  .dot{width:11px;height:11px;border-radius:50%;background:#39404d;margin-top:5px;flex:0 0 auto}
  .line{flex:1;width:2px;background:#2b313c;min-height:18px}
  .st.here .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(76,154,255,.2)}
  .st.dest .dot{background:var(--yes);box-shadow:0 0 0 4px rgba(37,194,110,.22)}
  .stname{font-size:14px;padding:2px 0 10px;line-height:1.4}
  .st.here .stname,.st.dest .stname{font-weight:700}
  .st.past .stname{color:#6b7382}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;
    margin-left:7px;vertical-align:1px}
  .tag.here{background:var(--accent);color:#04101f}
  .tag.dest{background:var(--yes);color:#04140b}
  .cut{font-size:12px;color:var(--dim);padding:6px 0 14px 27px}

  /* ---------- Variant D : A + ช่องกดเลข (คีย์บอร์ดเครื่อง) ---------- */
  .askD{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 16px 10px;
    border-bottom:1px solid var(--line)}
  .askD input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--fg);font-family:inherit;font-size:27px;font-weight:800;text-align:center;
    padding:13px 12px;letter-spacing:.05em;font-variant-numeric:tabular-nums;outline:none}
  .askD input::placeholder{font-size:15px;font-weight:500;color:#4a5260;letter-spacing:0}
  .askD input:focus{border-color:var(--accent)}
  .askD .hint{text-align:center;font-size:11.5px;color:var(--dim);margin-top:7px}
  .vcard{margin:12px 16px 0;border-radius:14px;padding:15px 16px;border:1px solid var(--line);
    background:var(--card)}
  .vcard.yes{background:var(--yes-d);border-color:var(--yes)}
  .vcard.no{background:var(--no-d);border-color:var(--no)}
  .vcard .vnum{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .vcard .vsay{font-size:19px;font-weight:800;margin-top:3px}
  .vcard.yes .vsay{color:var(--yes)} .vcard.no .vsay{color:var(--no)}
  .vcard.unk .vsay{color:var(--dim)}
  .vcard .vdet{font-size:13.5px;margin-top:8px;line-height:1.6;color:var(--fg)}
  .vcard .vdet .d{color:var(--dim)}

  /* ---------- แผนที่เส้นทาง (overlay) ---------- */
  .rowA[data-key]{cursor:pointer}
  .rowA .go{color:var(--accent);font-size:12px;margin-top:6px}
  .ov{position:fixed;inset:0;z-index:60;background:rgba(3,5,9,.72);display:none;
    align-items:flex-end;justify-content:center}
  .ov.on{display:flex}
  .ovin{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:var(--bg);
    border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--line)}
  .ovhead{position:sticky;top:0;background:var(--bg);padding:15px 16px 12px;
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
  .ovhead .t{flex:1;min-width:0}
  .ovhead .n{font-size:26px;font-weight:800;line-height:1.1}
  .ovhead .s{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.5}
  .ovhead .s b{color:var(--fg)}
  .ovhead button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;font-family:inherit}
  .mapbox{padding:12px 12px 0}
  .mapbox svg{width:100%;height:auto;display:block;background:#0b0e14;border-radius:14px;
    border:1px solid var(--line)}
  .maplg{display:flex;flex-wrap:wrap;gap:12px;padding:10px 16px 2px;font-size:11.5px;color:var(--dim)}
  .maplg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .mapnote{padding:4px 16px 12px;font-size:11px;color:#6b7382;line-height:1.5}

  /* ---------- switcher ---------- */
  #sw{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;
    display:flex;align-items:center;gap:4px;background:#fff;color:#0b0d12;
    border-radius:999px;padding:6px 7px;box-shadow:0 8px 30px rgba(0,0,0,.55);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #sw button{border:0;background:#eceff3;border-radius:999px;width:34px;height:34px;
    font-size:17px;cursor:pointer;color:#0b0d12;font-family:inherit}
  #sw button:active{background:#d7dbe2}
  #sw .lbl{font-size:12.5px;font-weight:700;padding:0 10px;white-space:nowrap}
</style>
</head>
<body>
<div id="phone"></div>
<div class="ov" id="ov"><div class="ovin" id="ovin"></div></div>

<div id="sw">
  <button id="prev" aria-label="variant ก่อนหน้า">←</button>
  <span class="lbl" id="lbl"></span>
  <button id="next" aria-label="variant ถัดไป">→</button>
</div>

<script>
const D = window.DATA;
const ok  = D.routes.filter(r => r.reachesDest);
const bad = D.routes.filter(r => !r.reachesDest);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const NOTE = `<div class="note">แอปรู้จักเฉพาะรถเมล์ <b>ขสมก. และ ไทยสมายล์บัส</b> —
  ที่ป้ายนี้อาจมีรถตู้ รถในซอย หรือรถร่วมที่ไปถึงได้ แต่แอปไม่มีข้อมูล</div>`;

const HEAD = `<div class="bar">
  <div class="from">ยืนอยู่ที่</div>
  <div class="stop">${esc(D.origin.name)}</div>
  <div class="to">จะไป <b>${esc(D.destination.label)}</b> · เดินจากป้ายไม่เกิน ${D.destination.radius} ม.</div>
</div>`;

/* =============== A : รายการเลขสายที่ถือรอ =============== */
function VariantA(){
  const row = r => `<div class="rowA${r.reachesDest?'':' miss'}" data-key="${esc(r.key)}">
      <div class="numA">${esc(r.number)}<small>${r.agency==='TSB'?'ไทยสมายล์':'ขสมก.'}</small></div>
      <div class="metaA">
        <div class="headA">${esc(r.headsign)}</div>
        <div class="subA">${ r.reachesDest
            ? `<b>อีก ${r.stopsToDest} ป้าย</b> · ลงป้าย ${esc(r.destStopName)}`
            : `ไม่ผ่าน${esc(D.destination.label)} · วิ่งต่ออีก ${r.totalAhead} ป้าย` }</div>
      </div></div>`;
  return HEAD + `<div class="wrap">
    <h3 class="sec">ขึ้นได้ ${ok.length} สาย</h3>
    ${ok.map(row).join('')}
    <details><summary>อีก ${bad.length} สายที่จอดป้ายนี้ — กดดูว่ามันไปไหน</summary>
      <div style="margin-top:8px">${bad.map(row).join('')}</div></details>
  </div>` + NOTE;
}
VariantA.title = 'รายการที่ถือรอ';

/* =============== B : แป้นกดเลขสาย =============== */
let typed = '';
function match(q){
  if(!q) return null;
  const norm = s => s.replace(/[^0-9a-zA-Z]/g, '').toLowerCase();
  const n = norm(q);
  // ตรงเป๊ะกับเลขใหม่หรือเลขเก่าก่อน แล้วค่อยขึ้นต้นด้วย
  const parts = r => {
    const m = r.number.match(/^([^()]+?)\s*(?:\(([^)]*)\))?$/);
    return [norm(m?m[1]:r.number), m&&m[2]?norm(m[2]):null].filter(Boolean);
  };
  return D.routes.find(r => parts(r).some(p => p === n))
      || D.routes.find(r => parts(r).some(p => p.startsWith(n)));
}
function VariantB(){
  const r = match(typed);
  const state = !typed ? 'idle' : r ? (r.reachesDest?'yes':'no') : 'unknown';
  const screen = {
    idle:    ['u','กดเลขที่เห็นข้างรถ','<span class="d">คันไหนก็ได้ที่กำลังเข้าป้าย</span>'],
    unknown: ['u','ไม่รู้จักสายนี้','<span class="d">สายนี้ไม่ได้จอดป้ายนี้ หรือเป็นรถที่แอปไม่มีข้อมูล</span>'],
    yes:     ['y','ขึ้นได้', r ? `หน้ารถเขียนว่า <b>${esc(r.headsign)}</b><br>
                 อีก ${r.stopsToDest} ป้าย · ลงป้าย <b>${esc(r.destStopName)}</b>` : ''],
    no:      ['n','อย่าขึ้น',  r ? `คันนี้ไป <b>${esc(r.headsign)}</b><br>
                 <span class="d">ไม่ผ่าน${esc(D.destination.label)}</span>` : '']
  }[state];
  const keys = ['1','2','3','4','5','6','7','8','9','-','0','⌫'];
  return HEAD + `
    <div class="screenB ${state==='yes'?'yes':state==='no'?'no':''}">
      <div class="typed">${ typed ? esc(typed) : '<span class="ph">—</span>' }</div>
      <div class="verdict ${screen[0]}">${screen[1]}</div>
      <div class="detail">${screen[2]}</div>
    </div>
    <div class="pad">${ keys.map(k =>
        `<button class="key${k==='-'||k==='⌫'?' alt':''}" data-k="${k}">${k}</button>`).join('') }</div>
    <div class="hintB">พิมพ์ได้ทั้งเลขใหม่และเลขเก่า เช่น <b>2-44</b> หรือ <b>54</b><br>
      ขึ้นรถไปแล้วก็กดได้ — มันจะบอกว่าคันที่นั่งอยู่กำลังไปไหน</div>` + NOTE;
}
VariantB.title = 'แป้นกดเลขสาย';

/* =============== C : แถบเส้นทาง =============== */
let sel = 0;
function VariantC(){
  const list = [...ok, ...bad];
  const r = list[sel] || list[0];
  const destIdx = r.reachesDest ? r.stopsToDest : -1;
  const shown = r.downstream.slice(0, destIdx >= 0 ? destIdx + 3 : 9);
  const rest  = r.downstream.length - shown.length;
  const st = (s,i) => {
    const cls = i===0 ? 'here' : i===destIdx ? 'dest' : (destIdx>=0 && i>destIdx) ? 'past' : '';
    const tag = i===0 ? '<span class="tag here">คุณอยู่ตรงนี้</span>'
              : i===destIdx ? '<span class="tag dest">ลงตรงนี้</span>' : '';
    return `<div class="st ${cls}">
        <div class="rail"><div class="dot"></div>${i<shown.length-1?'<div class="line"></div>':''}</div>
        <div class="stname">${esc(s.name)}${tag}</div></div>`;
  };
  return HEAD + `
    <div class="chips">${ list.map((x,i) =>
        `<button class="chip${x.reachesDest?' ok':''}${i===sel?' sel':''}" data-i="${i}">${esc(x.number)}</button>`
      ).join('') }</div>
    <div class="cHead">
      <div class="big">${esc(r.number)}</div>
      <div class="hs">หน้ารถเขียนว่า <b>${esc(r.headsign)}</b></div>
      <div class="hs">${ r.reachesDest
          ? `ผ่าน${esc(D.destination.label)} — ลงป้าย <b>${esc(r.destStopName)}</b>`
          : `<span style="color:var(--no)">ไม่ผ่าน${esc(D.destination.label)}</span>` }</div>
    </div>
    <div class="strip">${ shown.map(st).join('') }
      ${ rest > 0 ? `<div class="cut">… วิ่งต่ออีก ${rest} ป้าย จนสุดสาย</div>` : '' }</div>` + NOTE;
}
VariantC.title = 'แถบเส้นทาง';

/* =============== D : A + ช่องกดเลข (ใช้คีย์บอร์ดตัวเลขของเครื่อง) =============== */
let qD = '';
function VariantD(){
  const card = cardD();
  return HEAD + `
    <div class="askD">
      <input id="qd" type="text" inputmode="numeric" autocomplete="off"
             value="${esc(qD)}" placeholder="กดเลขที่เห็นข้างรถ">
      <div class="hint">เลขใหม่หรือเลขเก่าก็ได้ · <b>244</b> = <b>2-44</b> · เว้นว่างไว้เพื่อดูสายที่ขึ้นได้ทั้งหมด</div>
    </div>
    <div id="dcard">${card}</div>
    <div class="wrap" id="dlist">${bodyD()}</div>` + NOTE;
}
// ส่วนที่เปลี่ยนตามการพิมพ์ แยกออกมาเพื่อไม่ต้องสร้างช่องกรอกใหม่
function bodyD(){
  const norm = s => s.replace(/[^0-9a-zA-Z]/g, '').toLowerCase();
  const rowsAll = [...ok, ...bad];
  const listed = qD ? rowsAll.filter(x => norm(x.number).includes(norm(qD))) : ok;
  const row = x => `<div class="rowA${x.reachesDest?'':' miss'}" data-key="${esc(x.key)}">
      <div class="numA">${esc(x.number)}<small>${x.agency==='TSB'?'ไทยสมายล์':'ขสมก.'}</small></div>
      <div class="metaA">
        <div class="headA">${esc(x.headsign)}</div>
        <div class="subA">${ x.reachesDest
            ? `<b>อีก ${x.stopsToDest} ป้าย</b> · ลงป้าย ${esc(x.destStopName)}`
            : `ไม่ผ่าน${esc(D.destination.label)} · วิ่งต่ออีก ${x.totalAhead} ป้าย` }</div>
        <div class="go">ดูแผนที่เส้นทาง ›</div>
      </div></div>`;
  return `<h3 class="sec">${ qD ? `ตรงกับ ${listed.length} สายที่จอดป้ายนี้` : `ขึ้นได้ ${ok.length} สาย` }</h3>
    ${ listed.length ? listed.map(row).join('')
        : '<div style="color:var(--dim);font-size:13px;padding:6px 2px">ไม่มีสายที่ขึ้นต้นด้วยเลขนี้จอดป้ายนี้</div>' }
    ${ qD ? '' : `<details><summary>อีก ${bad.length} สายที่จอดป้ายนี้ — กดดูว่ามันไปไหน</summary>
      <div style="margin-top:8px">${bad.map(row).join('')}</div></details>` }`;
}
function cardD(){
  const r = match(qD);
  if(!qD) return '';
  if(!r) return `<div class="vcard unk"><div class="vsay">ไม่รู้จักสายนี้</div>
      <div class="vdet d">สายนี้ไม่ได้จอดป้ายนี้ หรือเป็นรถที่แอปไม่มีข้อมูล</div></div>`;
  if(r.reachesDest) return `<div class="vcard yes"><div class="vnum">${esc(r.number)}</div>
      <div class="vsay">ขึ้นได้</div>
      <div class="vdet">หน้ารถเขียนว่า <b>${esc(r.headsign)}</b><br>
      อีก ${r.stopsToDest} ป้าย · ลงป้าย <b>${esc(r.destStopName)}</b></div></div>`;
  return `<div class="vcard no"><div class="vnum">${esc(r.number)}</div>
      <div class="vsay">อย่าขึ้น</div>
      <div class="vdet">คันนี้ไป <b>${esc(r.headsign)}</b><br>
      <span class="d">ไม่ผ่าน${esc(D.destination.label)} · วิ่งต่ออีก ${r.totalAhead} ป้าย</span></div></div>`;
}
VariantD.title = 'รายการ + ช่องกดเลข';

/* =============== แผนที่เส้นทาง =============== */
function mapSVG(r){
  const W=320,H=300,PAD=18;
  const pts=(r.path||[]);
  const withXY=r.downstream.filter(s=>s.lat);
  const all=[...pts,...withXY.map(s=>[s.lat,s.lon]),[D.destination.lat,D.destination.lon]];
  if(pts.length<2) return '<div class="mapnote">ฟีดไม่มีเส้นทางของสายนี้</div>';
  const laMid=(Math.min(...all.map(p=>p[0]))+Math.max(...all.map(p=>p[0])))/2;
  const mx=lon=>lon*111320*Math.cos(laMid*Math.PI/180), my=lat=>-lat*110540;
  const X=all.map(p=>mx(p[1])), Y=all.map(p=>my(p[0]));
  const x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y);
  const k=Math.min((W-2*PAD)/Math.max(x1-x0,1),(H-2*PAD)/Math.max(y1-y0,1));
  const ox=(W-(x1-x0)*k)/2, oy=(H-(y1-y0)*k)/2;
  const P=(lat,lon)=>[((mx(lon)-x0)*k+ox).toFixed(1),((my(lat)-y0)*k+oy).toFixed(1)];
  const line=pts.map(p=>P(p[0],p[1]).join(',')).join(' ');
  // --- ฉากหลัง: แม่น้ำและถนนสายหลักจาก OpenStreetMap ตัดเฉพาะที่อยู่ในกรอบ ---
  const laN=Math.max(...all.map(p=>p[0])), laS=Math.min(...all.map(p=>p[0]));
  const loE=Math.max(...all.map(p=>p[1])), loW=Math.min(...all.map(p=>p[1]));
  const mg=0.12, dLa=(laN-laS)*mg+0.004, dLo=(loE-loW)*mg+0.004;
  const inView=w=>w.some(p=>p[0]>laS-dLa&&p[0]<laN+dLa&&p[1]>loW-dLo&&p[1]<loE+dLo);
  const layer=(ways,stroke,width,op)=>(ways||[]).filter(inView).map(w=>
      '<polyline points="'+w.map(p=>P(p[0],p[1]).join(',')).join(' ')
      +'" fill="none" stroke="'+stroke+'" stroke-width="'+width+'" opacity="'+op+'"/>').join('');
  const BGL = (typeof BG!=='undefined')
      ? layer(BG.road,'#3d4553',1.2,'1') + layer(BG.river,'#28486b',3.6,'1')
      : '';
  // --- ชื่อถนน/แม่น้ำ: เลือกเฉพาะที่อยู่ในกรอบ เรียงตามความสำคัญ แล้วกันไม่ให้ทับกัน ---
  const pri={w:0,'3':1,'2':2,'1':3};
  const taken=[], usedName=new Set();
  const fits=(x,y,wd)=>!taken.some(t=>Math.abs(t[0]-x)<(t[2]+wd)/2+6&&Math.abs(t[1]-y)<13);
  // --- สถานที่ใกล้เคียง: สถานีรถไฟฟ้า ห้าง โรงพยาบาล มหาวิทยาลัย ตลาด ท่าเรือ ---
  const POIC={s:'#f0b429',m:'#d98ae0',h:'#ef6a7a',u:'#63c9c0',k:'#e0a06a',f:'#6f9fd0'};
  const POI=((typeof BG!=='undefined'&&BG.poi)||[])
    .filter(p=>p[2]>laS-dLa&&p[2]<laN+dLa&&p[3]>loW-dLo&&p[3]<loE+dLo)
    .reduce((acc,p)=>{
      if(acc.length>=7) return acc;
      const [x,y]=P(p[2],p[3]).map(Number);
      const wd=p[0].length*5.2;
      if(x-wd/2<3||x+wd/2>W-3||y<12||y>H-8||!fits(x,y,wd)) return acc;
      taken.push([x,y,wd]);
      acc.push('<circle cx="'+x+'" cy="'+y+'" r="2.4" fill="'+(POIC[p[1]]||'#9aa3b2')+'"/>'
        +'<text x="'+x+'" y="'+(y-5.5)+'" fill="'+(POIC[p[1]]||'#9aa3b2')+'" font-size="8" '
        +'text-anchor="middle" paint-order="stroke" stroke="#0b0e14" stroke-width="2.6" '
        +'stroke-linejoin="round">'+esc(p[0])+'</text>');
      return acc;
    },[]).join('');
  const LBL=((typeof BG!=='undefined'&&BG.label)||[])
    .filter(l=>l[2]>laS-dLa&&l[2]<laN+dLa&&l[3]>loW-dLo&&l[3]<loE+dLo)
    .sort((a,b)=>pri[a[1]]-pri[b[1]])
    .reduce((acc,l)=>{
      if(acc.length>=6||usedName.has(l[0])) return acc;
      const [x,y]=P(l[2],l[3]).map(Number);
      const wd=l[0].length*5.1;
      if(x-wd/2<3||x+wd/2>W-3||y<10||y>H-6||!fits(x,y,wd)) return acc;
      taken.push([x,y,wd]); usedName.add(l[0]);
      acc.push('<text x="'+x+'" y="'+y+'" transform="rotate('+l[4]+' '+x+' '+y+')" '
        +'fill="'+(l[1]==='w'?'#6f9fd0':'#8d97a8')+'" font-size="8" text-anchor="middle" '
        +'paint-order="stroke" stroke="#0b0e14" stroke-width="2.6" stroke-linejoin="round">'
        +esc(l[0])+'</text>');
      return acc;
    },[]).join('');
  const dest=P(D.destination.lat,D.destination.lon);
  const rad=(D.destination.radius*k).toFixed(1);
  const dots=withXY.map((s,i)=>{
      if(i===0||(r.reachesDest&&i===r.stopsToDest)) return '';
      const [x,y]=P(s.lat,s.lon);
      return '<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="#5a6270"/>';}).join('');
  let mark='';
  if(r.reachesDest){
    const s=r.downstream[r.stopsToDest]; const [x,y]=P(s.lat,s.lon);
    mark='<circle cx="'+x+'" cy="'+y+'" r="9" fill="#25c26e" opacity=".22"/>'
        +'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#25c26e"/>';
  }
  const o=P(r.downstream[0].lat,r.downstream[0].lon);
  const lbl=(p,t,fill,dy)=>'<text x="'+p[0]+'" y="'+(+p[1]+(dy||-11))+'" fill="'+fill+'" font-size="9.5" '
    +'font-weight="700" text-anchor="middle" paint-order="stroke" stroke="#0b0e14" '
    +'stroke-width="3" stroke-linejoin="round">'+t+'</text>';
  return '<div class="mapbox"><svg viewBox="0 0 '+W+' '+H+'" role="img">'
    +BGL+LBL+POI
    +'<circle cx="'+dest[0]+'" cy="'+dest[1]+'" r="'+rad+'" fill="#4c9aff" opacity=".07" '
    +'stroke="#4c9aff" stroke-opacity=".3" stroke-dasharray="4 4"/>'
    +'<polyline points="'+line+'" fill="none" stroke="'+(r.reachesDest?'#25c26e':'#ef4a5c')+'" '
    +'stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>'
    +dots+mark
    +'<circle cx="'+o[0]+'" cy="'+o[1]+'" r="10" fill="#4c9aff" opacity=".22"/>'
    +'<circle cx="'+o[0]+'" cy="'+o[1]+'" r="5.5" fill="#4c9aff"/>'
    +lbl(dest,esc(D.destination.label),'#8fc0ff',16)
    +lbl(o,'ป้ายที่ยืน','#cfe0f7')
    +'</svg></div>'
    +'<div class="maplg"><span><i style="background:#4c9aff"></i>ป้ายที่ยืนอยู่</span>'
    +(r.reachesDest?'<span><i style="background:#25c26e"></i>ป้ายที่ต้องลง</span>':'')
    +'<span><i style="background:#4c9aff;opacity:.45"></i>รัศมีเดินจาก'+esc(D.destination.label)+'</span>'
    +'<span><i style="background:#5a6270"></i>ป้ายระหว่างทาง</span>'
    +'<span><i style="background:#28486b"></i>แม่น้ำ/คลอง</span>'
    +'<span><i style="background:#3d4553"></i>ถนนสายหลัก + ชื่อถนน</span>'
    +'<span><i style="background:#f0b429"></i>สถานีรถไฟฟ้า</span>'
    +'<span><i style="background:#d98ae0"></i>ห้าง</span>'
    +'<span><i style="background:#ef6a7a"></i>โรงพยาบาล</span>'
    +'<span><i style="background:#63c9c0"></i>มหาวิทยาลัย</span>'
    +'<span><i style="background:#e0a06a"></i>ตลาด</span>'
    +'<span><i style="background:#6f9fd0"></i>ท่าเรือ</span></div>'
    +'<div class="mapnote">เส้นจริงจาก shapes.txt ของฟีด วาดเฉพาะช่วงที่วิ่งต่อจากป้ายนี้ไป '
    +'· ฉากหลัง ชื่อถนน และสถานที่ใกล้เคียง มาจาก OpenStreetMap ที่อบไว้ในไฟล์ (306 KB) '
    +'ไม่ได้ดึงจากแผนที่ออนไลน์ เพื่อให้เปิดได้ตอนไม่มีเน็ต</div>';
}
function stripHTML(r){
  const di = r.reachesDest ? r.stopsToDest : -1;
  const shown = r.downstream.slice(0, di>=0 ? di+3 : 10);
  const rest = r.downstream.length - shown.length;
  const st=(s,i)=>{
    const cls = i===0?'here' : i===di?'dest' : (di>=0&&i>di)?'past':'';
    const tag = i===0?'<span class="tag here">คุณอยู่ตรงนี้</span>'
              : i===di?'<span class="tag dest">ลงตรงนี้</span>':'';
    return '<div class="st '+cls+'"><div class="rail"><div class="dot"></div>'
      +(i<shown.length-1?'<div class="line"></div>':'')+'</div>'
      +'<div class="stname">'+esc(s.name)+tag+'</div></div>';};
  return '<div class="strip">'+shown.map(st).join('')
    +(rest>0?'<div class="cut">… วิ่งต่ออีก '+rest+' ป้าย จนสุดสาย</div>':'')+'</div>';
}
function openMap(key){
  const r = D.routes.find(x => x.key === key); if(!r) return;
  const sub = r.reachesDest
    ? 'ผ่าน'+esc(D.destination.label)+' — ลงป้าย <b>'+esc(r.destStopName)+'</b> (อีก '+r.stopsToDest+' ป้าย)'
    : '<span style="color:var(--no)">ไม่ผ่าน'+esc(D.destination.label)+'</span> · วิ่งต่ออีก '+r.totalAhead+' ป้าย';
  document.getElementById('ovin').innerHTML =
      '<div class="ovhead"><div class="t"><div class="n">'+esc(r.number)+'</div>'
    + '<div class="s">หน้ารถเขียนว่า <b>'+esc(r.headsign)+'</b></div>'
    + '<div class="s">'+sub+'</div></div>'
    + '<button id="ovx" aria-label="ปิด">✕</button></div>'
    + mapSVG(r) + stripHTML(r);
  document.getElementById('ovin').scrollTop = 0;
  document.getElementById('ov').classList.add('on');
  document.getElementById('ovx').onclick = closeMap;
}
function closeMap(){ document.getElementById('ov').classList.remove('on'); }

/* =============== switcher =============== */
const V = {D:VariantD, A:VariantA, B:VariantB, C:VariantC};
const keysV = Object.keys(V);
let curV = (() => { try { const v = new URLSearchParams(location.search).get('variant');
                      return V[v] ? v : 'D'; } catch(e) { return 'D'; } })();
 const cur = () => curV;
function render(){
  const k = cur();
  document.getElementById('phone').innerHTML = V[k]();
  document.getElementById('lbl').textContent = k + ' — ' + V[k].title;
  if(k === 'B') document.querySelectorAll('.key').forEach(b => b.onclick = () => {
      const x = b.dataset.k;
      typed = x === '⌫' ? typed.slice(0,-1) : (typed.length < 7 ? typed + x : typed);
      render();
  });
  if(k === 'C') document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      sel = +b.dataset.i; render();
  });
  if(k === 'D'){
    const el = document.getElementById('qd');
    el.addEventListener('input', () => {
      qD = el.value;
      document.getElementById('dcard').innerHTML = cardD();
      document.getElementById('dlist').innerHTML = bodyD();
    });
  }
}
function go(step){
  curV = keysV[(keysV.indexOf(curV) + step + keysV.length) % keysV.length];
  try { const u = new URL(location); u.searchParams.set('variant', curV);
        history.replaceState({}, '', u); } catch(e) {}
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'ArrowRight') go(1);
});
document.getElementById('ov').addEventListener('click', e => {
  if(e.target.id === 'ov') closeMap();
});
document.addEventListener('click', e => {
  const row = e.target.closest && e.target.closest('.rowA[data-key]');
  if(row) openMap(row.dataset.key);
});
addEventListener('keydown', e => { if(e.key === 'Escape') closeMap(); });
render();
</script>
