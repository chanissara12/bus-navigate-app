<div class="grid grid-cols-1 md:grid-cols-[320px_1fr] h-[calc(100vh-4rem)] pb-16">
    <div class="border-r border-slate-200 bg-white overflow-y-auto">
        <div class="p-3 border-b border-slate-200 text-xs font-semibold text-slate-500">ป้ายรถใกล้เคียง</div>

        <button
            type="button"
            *ngFor="let stop of stops"
            (click)="select(stop.id)"
            class="w-full text-left flex items-center gap-3 px-3 py-3 border-b border-slate-100 cursor-pointer hover:bg-sky-50"
            [ngClass]="stop.id === selectedId() ? 'bg-sky-50 border-l-4 border-l-sky-600' : 'border-l-4 border-l-transparent'"
        >
            <span class="flex-1 min-w-0">
                <span class="block text-sm font-medium text-slate-900 truncate">{{ stop.nameTh }}</span>
                <span class="block text-xs text-slate-500">{{ stop.distanceMeters }} ม. · {{ stop.landmarks.length }} จุดสังเกต</span>
            </span>
        </button>
    </div>

    <div *ngIf="selectedStop() as stop" class="p-6 overflow-y-auto">
        <div class="mb-6">
            <div class="text-lg font-semibold text-slate-900">{{ stop.nameTh }}</div>
            <div class="text-sm text-slate-500">{{ stop.nameEn }}<ng-container *ngIf="stop.stopCode"> · {{ stop.stopCode }}</ng-container></div>
        </div>

        <div *ngIf="groupedLandmarks().length === 0" class="text-sm text-slate-400">ไม่มีข้อมูลจุดสังเกตสำหรับป้ายนี้</div>

        <div *ngFor="let group of groupedLandmarks()" class="mb-5">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 mb-2">
                <span>{{ landmarkIcon(group.type) }}</span>
                <span>{{ landmarkLabel(group.type) }}</span>
            </div>
            <div
                *ngFor="let landmark of group.landmarks"
                class="rounded-xl border border-slate-200 bg-white p-3 mb-2 text-sm"
            >
                <div class="text-slate-900">{{ landmark.nameTh }}</div>
                <div class="text-xs text-slate-500">{{ landmark.distanceMeters }} ม. จากป้าย</div>
                <div *ngIf="landmark.description" class="text-xs text-slate-400 mt-1">{{ landmark.description }}</div>
            </div>
        </div>
    </div>
</div>
