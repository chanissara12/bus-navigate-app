<div class="max-w-xl mx-auto px-4 py-6 pb-24">
    <h2 class="text-sm font-semibold text-slate-500 mb-3">ป้ายรถใกล้เคียง ({{ stops.length }})</h2>

    <div class="flex flex-col gap-3">
        <article
            *ngFor="let stop of stops"
            class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden"
        >
            <button
                type="button"
                (click)="toggle(stop.id)"
                class="w-full flex items-center justify-between gap-3 p-4 text-left cursor-pointer hover:bg-slate-50"
            >
                <span>
                    <span class="block text-sm font-semibold text-slate-900">{{ stop.nameTh }}</span>
                    <span class="block text-xs text-slate-500">{{ stop.nameEn }} · {{ stop.distanceMeters }} ม.</span>
                </span>
                <span class="text-slate-400 text-sm">{{ expandedId() === stop.id ? '▲' : '▼' }}</span>
            </button>

            <div *ngIf="expandedId() === stop.id" class="border-t border-slate-100 px-4 py-3 bg-slate-50">
                <div *ngIf="stop.landmarks.length === 0" class="text-xs text-slate-400">ไม่มีข้อมูลจุดสังเกต</div>
                <div *ngFor="let landmark of stop.landmarks" class="flex items-start gap-2 py-1.5 text-sm">
                    <span>{{ landmarkIcon(landmark.landmarkType) }}</span>
                    <span class="flex-1">
                        <span class="block text-slate-900">{{ landmark.nameTh }}</span>
                        <span class="block text-xs text-slate-500">
                            {{ landmarkLabel(landmark.landmarkType) }} · {{ landmark.distanceMeters }} ม.
                        </span>
                    </span>
                </div>
            </div>
        </article>
    </div>
</div>
