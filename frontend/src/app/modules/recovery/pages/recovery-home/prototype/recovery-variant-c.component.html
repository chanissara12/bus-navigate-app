<div class="max-w-xl mx-auto px-4 py-6 pb-24">
    <div class="rounded-xl bg-red-50 border border-red-200 px-4 py-3 mb-6 text-sm text-red-800 font-medium">
        ⚠️ ดูเหมือนคุณขึ้นรถผิดสาย
    </div>

    <div class="flex flex-col gap-3 mb-4">
        <article
            *ngFor="let opt of recommended"
            class="rounded-2xl p-4 shadow-sm"
            [ngClass]="opt.isCurrentBus ? 'border border-slate-200 bg-slate-50' : 'border-2 border-emerald-400 bg-emerald-50'"
        >
            <div class="flex items-center justify-between mb-1">
                <span class="text-sm font-semibold" [ngClass]="opt.isCurrentBus ? 'text-slate-600' : 'text-emerald-900'">
                    {{ opt.label }}
                </span>
                <span *ngIf="!opt.isCurrentBus" class="text-[10px] font-bold uppercase tracking-wide text-emerald-700 bg-emerald-100 rounded-full px-2 py-0.5">
                    แนะนำ
                </span>
                <span *ngIf="opt.isCurrentBus" class="text-[10px] uppercase tracking-wide text-slate-400">
                    คันเดิม (ไม่แนะนำเป็นพิเศษ)
                </span>
            </div>
            <div class="text-xs" [ngClass]="opt.isCurrentBus ? 'text-slate-400' : 'text-emerald-700'">
                {{ opt.distanceMeters }} ม. · {{ opt.reasons.join(' · ') }}
            </div>
        </article>
    </div>

    <button
        type="button"
        (click)="toggleLastResort()"
        class="w-full text-left text-xs font-semibold text-slate-400 uppercase mb-2 cursor-pointer"
    >
        {{ lastResortExpanded() ? '▲' : '▼' }} ทางเลือกสุดท้าย ({{ lastResort.length }})
    </button>
    <div *ngIf="lastResortExpanded()" class="flex flex-col gap-2 mb-4 opacity-70">
        <article *ngFor="let opt of lastResort" class="rounded-xl border border-slate-200 bg-white p-3 text-sm">
            <div class="text-slate-700">{{ opt.label }}</div>
            <div class="text-xs text-slate-400">{{ opt.distanceMeters }} ม. · {{ opt.reasons.join(' · ') }}</div>
        </article>
    </div>

    <div class="flex flex-col gap-2">
        <article
            *ngFor="let opt of unconfirmedRail"
            class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3 text-sm opacity-80"
        >
            <div class="text-slate-600">{{ opt.label }} <span class="text-[10px] text-slate-400">(ยังไม่ยืนยัน)</span></div>
            <div class="text-xs text-slate-400">{{ opt.distanceMeters }} ม.</div>
        </article>
    </div>
</div>
