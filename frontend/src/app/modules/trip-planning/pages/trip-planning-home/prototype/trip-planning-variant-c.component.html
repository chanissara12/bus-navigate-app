<div class="px-4 py-4 pb-24">
    <div class="flex items-center gap-2 rounded-full bg-white border border-slate-200 shadow-sm px-4 py-2 max-w-md mx-auto mb-6">
        <span class="text-slate-400">📍</span>
        <span class="text-sm text-slate-500">ตำแหน่งของฉัน</span>
        <span class="text-slate-300">→</span>
        <span class="text-sm font-medium text-slate-900">{{ destination }}</span>
    </div>

    <h2 class="text-center text-sm font-semibold text-slate-500 mb-3">เปรียบเทียบ {{ options.length }} เส้นทาง</h2>

    <div class="flex gap-4 overflow-x-auto snap-x snap-mandatory px-2 pb-4">
        <article
            *ngFor="let option of options"
            class="snap-center shrink-0 w-64 rounded-2xl border border-slate-200 bg-white shadow-sm p-4"
        >
            <div class="flex items-center justify-center mb-3">
                <span class="flex h-12 w-12 items-center justify-center rounded-full bg-sky-600 text-white text-lg font-bold">
                    {{ option.routeNumber }}
                </span>
            </div>

            <div class="text-center text-sm font-medium text-slate-900 mb-3">{{ option.directionName }}</div>

            <table class="w-full text-xs text-slate-600">
                <tbody>
                    <tr class="border-t border-slate-100">
                        <td class="py-1.5 text-slate-400">ขึ้นที่</td>
                        <td class="py-1.5 text-right">{{ option.boardingStopName }}</td>
                    </tr>
                    <tr class="border-t border-slate-100">
                        <td class="py-1.5 text-slate-400">ลงที่</td>
                        <td class="py-1.5 text-right">{{ option.alightingStopName }}</td>
                    </tr>
                    <tr class="border-t border-slate-100">
                        <td class="py-1.5 text-slate-400">เดิน</td>
                        <td class="py-1.5 text-right">{{ option.walkingDistanceMeters }} ม.</td>
                    </tr>
                    <tr class="border-t border-slate-100">
                        <td class="py-1.5 text-slate-400">สถานะ</td>
                        <td class="py-1.5 text-right">
                            <span
                                class="inline-block rounded-full px-2 py-0.5 text-xs font-medium"
                                [ngClass]="statusClasses(option.serviceStatus)"
                            >
                                {{ statusLabel(option.serviceStatus) }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </article>
    </div>
</div>
