<div class="max-w-xl mx-auto px-4 py-6 pb-24">
    <div class="rounded-2xl bg-white shadow-sm border border-slate-200 p-4 mb-6">
        <label class="block text-xs font-medium text-slate-500 mb-1">ตำแหน่งปัจจุบัน</label>
        <div class="flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 mb-3 text-sm text-slate-700">
            <span>📍</span>
            <span>ตำแหน่งของฉัน</span>
        </div>

        <label class="block text-xs font-medium text-slate-500 mb-1">ปลายทาง</label>
        <div class="flex items-center gap-2 rounded-lg border border-sky-300 px-3 py-2 text-sm text-slate-900">
            <span>🎯</span>
            <span>{{ destination }}</span>
        </div>
    </div>

    <h2 class="text-sm font-semibold text-slate-500 mb-3">เส้นทางที่แนะนำ ({{ options.length }})</h2>

    <div class="flex flex-col gap-3">
        <article
            *ngFor="let option of options"
            class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md hover:border-sky-300 transition cursor-pointer"
        >
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-sky-600 text-white text-sm font-bold">
                        {{ option.routeNumber }}
                    </span>
                    <span class="text-sm font-medium text-slate-900">{{ option.directionName }}</span>
                </div>
                <span class="rounded-full px-2 py-0.5 text-xs font-medium" [ngClass]="statusClasses(option.serviceStatus)">
                    {{ statusLabel(option.serviceStatus) }}
                </span>
            </div>

            <div class="text-sm text-slate-600 space-y-1">
                <div>🚏 ขึ้นที่ {{ option.boardingStopName }}</div>
                <div>🏁 ลงที่ {{ option.alightingStopName }}</div>
                <div>🚶 เดิน {{ option.walkingDistanceMeters }} ม.</div>
            </div>
        </article>
    </div>
</div>
