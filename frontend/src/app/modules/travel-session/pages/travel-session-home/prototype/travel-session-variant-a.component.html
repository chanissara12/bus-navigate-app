<app-prototype-state-selector [current]="demoState()" (currentChange)="setState($event)"></app-prototype-state-selector>

<div class="max-w-md mx-auto px-4 py-8 pb-24">
    <div
        class="rounded-2xl border shadow-sm p-6 text-center"
        [ngClass]="isMisboarded ? 'bg-red-50 border-red-300' : 'bg-white border-slate-200'"
    >
        <div class="text-4xl mb-3">{{ current.icon }}</div>
        <div class="text-lg font-semibold mb-1" [ngClass]="isMisboarded ? 'text-red-800' : 'text-slate-900'">
            {{ current.label }}
        </div>
        <div class="text-sm" [ngClass]="isMisboarded ? 'text-red-700' : 'text-slate-600'">
            {{ current.instruction }}
        </div>

        <div *ngIf="isRiding" class="mt-4">
            <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full bg-sky-600 rounded-full" style="width: 80%"></div>
            </div>
            <div *ngIf="progress.isApproachingDestination" class="mt-3 rounded-lg bg-amber-100 text-amber-800 text-sm font-medium px-3 py-2">
                🔔 ใกล้ถึงจุดลงแล้ว เตรียมตัวลงรถ
            </div>
        </div>

        <button
            *ngIf="isMisboarded"
            type="button"
            class="mt-4 w-full rounded-lg bg-red-600 text-white text-sm font-medium py-2.5 cursor-pointer hover:bg-red-700"
        >
            ดูทางเลือกแก้ปัญหา
        </button>
    </div>
</div>
