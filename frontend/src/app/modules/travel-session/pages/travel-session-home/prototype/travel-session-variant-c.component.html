<app-prototype-state-selector [current]="demoState()" (currentChange)="setState($event)"></app-prototype-state-selector>

<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-6 pb-24 transition-colors" [ngClass]="colorClasses">
    <div class="text-6xl mb-4">{{ current.icon }}</div>
    <div class="text-2xl font-bold mb-2">{{ current.label }}</div>
    <div class="text-sm opacity-90 max-w-xs">{{ current.instruction }}</div>

    <div *ngIf="isRiding && progress.isApproachingDestination" class="mt-6 rounded-full bg-white/20 px-4 py-2 text-sm font-semibold">
        🔔 เหลืออีก {{ progress.remainingStopCount }} ป้ายถึงจุดลง
    </div>

    <button
        *ngIf="isMisboarded"
        type="button"
        class="mt-6 rounded-lg bg-white text-red-700 text-sm font-semibold px-5 py-2.5 cursor-pointer hover:bg-red-50"
    >
        ดูทางเลือกแก้ปัญหา
    </button>
</div>
