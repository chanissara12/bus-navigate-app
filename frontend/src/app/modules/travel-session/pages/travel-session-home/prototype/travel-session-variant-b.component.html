<app-prototype-state-selector [current]="demoState()" (currentChange)="setState($event)"></app-prototype-state-selector>

<div class="max-w-md mx-auto px-4 py-8 pb-24">
    <div *ngIf="isMisboarded" class="rounded-2xl bg-red-50 border border-red-300 p-4 text-center mb-4">
        <div class="text-3xl mb-2">⚠️</div>
        <div class="text-sm font-semibold text-red-800 mb-1">ดูเหมือนคุณขึ้นรถผิดสาย</div>
        <button type="button" class="mt-2 w-full rounded-lg bg-red-600 text-white text-sm font-medium py-2.5 cursor-pointer hover:bg-red-700">
            ดูทางเลือกแก้ปัญหา
        </button>
    </div>

    <div *ngIf="isCompleted" class="rounded-2xl bg-emerald-50 border border-emerald-300 p-6 text-center">
        <div class="text-3xl mb-2">✅</div>
        <div class="text-sm font-semibold text-emerald-800">เดินทางถึงจุดหมายแล้ว</div>
    </div>

    <ol *ngIf="!isMisboarded && !isCompleted" class="relative border-l-2 border-slate-200 ml-3">
        <li *ngFor="let step of timelineStates; let i = index" class="mb-6 ml-6">
            <span
                class="absolute -left-3 flex h-6 w-6 items-center justify-center rounded-full text-xs"
                [ngClass]="{
                    'bg-emerald-500 text-white': stepStatus(i) === 'done',
                    'bg-sky-600 text-white': stepStatus(i) === 'current',
                    'bg-slate-200 text-slate-500': stepStatus(i) === 'upcoming'
                }"
            >
                {{ stepStatus(i) === 'done' ? '✓' : step.icon }}
            </span>
            <div
                class="text-sm font-medium"
                [ngClass]="stepStatus(i) === 'upcoming' ? 'text-slate-400' : 'text-slate-900'"
            >
                {{ step.label }}
            </div>
            <div *ngIf="stepStatus(i) === 'current'" class="text-xs text-slate-500">{{ step.instruction }}</div>

            <div *ngIf="stepStatus(i) === 'current' && step.state === 'Riding'" class="mt-2">
                <div *ngIf="progress.isApproachingDestination" class="rounded-lg bg-amber-100 text-amber-800 text-xs font-medium px-3 py-2">
                    🔔 ใกล้ถึงจุดลงแล้ว เตรียมตัวลงรถ
                </div>
            </div>
        </li>
    </ol>
</div>
