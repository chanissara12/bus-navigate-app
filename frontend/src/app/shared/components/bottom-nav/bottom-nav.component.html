@if (activeTab$ | async; as activeTab) {
  <nav
    class="fixed inset-x-0 bottom-0 z-40 flex border-t border-ink-200 bg-white"
    >
    <a
      routerLink="/trip-planning"
      data-testid="nav-tab-trip-planning"
      class="flex flex-1 cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-accent-400 active:bg-ink-100"
      [class.text-accent-600]="activeTab === 'trip-planning'"
      [class.text-ink-500]="activeTab !== 'trip-planning'"
      >
      <span aria-hidden="true">🔍</span>
      <span>ค้นหาเส้นทาง</span>
    </a>
    <a
      routerLink="/bus-stop"
      data-testid="nav-tab-bus-stop"
      class="flex flex-1 cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-accent-400 active:bg-ink-100"
      [class.text-accent-600]="activeTab === 'bus-stop'"
      [class.text-ink-500]="activeTab !== 'bus-stop'"
      >
      <span aria-hidden="true">🚏</span>
      <span>ป้ายรถ</span>
    </a>
    <button
      type="button"
      data-testid="nav-tab-travel-session"
      class="flex flex-1 cursor-pointer flex-col items-center gap-1 py-2 text-xs font-medium hover:bg-ink-50 focus:outline-none focus:ring-2 focus:ring-accent-400 active:bg-ink-100"
      [class.text-accent-600]="activeTab === 'travel-session'"
      [class.text-ink-500]="activeTab !== 'travel-session'"
      (click)="onTravelSessionTabClick()"
      >
      <span aria-hidden="true">🚌</span>
      <span>การเดินทางของฉัน</span>
    </button>
  </nav>
}
