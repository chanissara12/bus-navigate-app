<div
    class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 rounded-full bg-fuchsia-900 text-white px-4 py-2 shadow-lg ring-2 ring-fuchsia-400"
>
    <button
        type="button"
        class="cursor-pointer rounded-full px-2 py-1 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-fuchsia-300"
        (click)="previous()"
        aria-label="Previous loading/error variant"
    >
        ←
    </button>

    <span class="text-sm font-medium tabular-nums">F04: {{ variant }} ({{ currentLabel }})</span>

    <button
        type="button"
        class="cursor-pointer rounded-full px-2 py-1 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-fuchsia-300"
        (click)="next()"
        aria-label="Next loading/error variant"
    >
        →
    </button>
</div>

<app-loading-error-variant-a *ngIf="variant === 'A'"></app-loading-error-variant-a>
<app-loading-error-variant-b *ngIf="variant === 'B'"></app-loading-error-variant-b>
<app-loading-error-variant-c *ngIf="variant === 'C'"></app-loading-error-variant-c>
<app-loading-error-variant-d *ngIf="variant === 'D'"></app-loading-error-variant-d>
