<div class="max-w-xl mx-auto px-4 pt-20 pb-8">
    <div class="flex flex-wrap gap-2 mb-4">
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-sky-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-sky-700"
            (click)="simulateListLoad()"
        >
            จำลองโหลดรายการ
        </button>
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-sky-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-sky-700"
            (click)="simulateCardLoad()"
        >
            จำลองโหลดการ์ด
        </button>
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-red-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-red-700"
            (click)="triggerError()"
        >
            แจ้ง error
        </button>
    </div>

    <!-- Contextual banner: sits right where the action above just happened, not
         pinned to a screen edge — the eye is already here. -->
    <div
        *ngIf="latestError() as err"
        class="mb-4 flex items-start gap-3 rounded-xl border-2 border-red-400 bg-red-50 px-4 py-3 shadow-md transition-all duration-300 ease-out"
        [class.opacity-0]="!errorSettled()"
        [class.-translate-y-2]="!errorSettled()"
    >
        <span class="text-2xl leading-none">🚫</span>
        <div class="flex-1">
            <div class="text-sm font-bold text-red-800">เกิดข้อผิดพลาด</div>
            <div class="text-sm text-red-700">{{ err }}</div>
        </div>
        <button type="button" class="cursor-pointer text-red-600 font-bold px-1" (click)="dismissError()" aria-label="Dismiss error">
            ×
        </button>
    </div>

    <h3 class="text-sm font-semibold text-slate-500 mb-2">รายการ (list-shaped)</h3>
    <div class="flex flex-col gap-3 mb-6">
        <ng-container *ngIf="listLoading(); else loadedList">
            <div *ngFor="let _ of [1, 2, 3]" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm animate-pulse">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <div class="h-8 w-8 rounded-full bg-slate-200"></div>
                        <div class="h-3 w-32 rounded bg-slate-200"></div>
                    </div>
                    <div class="h-4 w-14 rounded-full bg-slate-200"></div>
                </div>
                <div class="h-3 w-40 rounded bg-slate-200"></div>
            </div>
        </ng-container>
        <ng-template #loadedList>
            <article *ngFor="let item of listItems" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="flex items-center gap-2 mb-2">
                    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-sky-600 text-white text-sm font-bold">
                        {{ item.routeNumber }}
                    </span>
                    <span class="text-sm font-medium text-slate-900">{{ item.directionName }}</span>
                </div>
                <div class="text-sm text-slate-600">🚏 {{ item.boardingStopName }}</div>
            </article>
        </ng-template>
    </div>

    <h3 class="text-sm font-semibold text-slate-500 mb-2">การ์ด (card-shaped)</h3>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center">
        <ng-container *ngIf="cardLoading(); else loadedCard">
            <div class="h-10 w-10 rounded-full bg-slate-200 mx-auto mb-3 animate-pulse"></div>
            <div class="h-3 w-1/2 rounded bg-slate-200 mx-auto mb-2 animate-pulse"></div>
            <div class="h-3 w-2/3 rounded bg-slate-200 mx-auto animate-pulse"></div>
        </ng-container>
        <ng-template #loadedCard>
            <div class="text-3xl mb-2">{{ card.icon }}</div>
            <div class="text-base font-semibold text-slate-900 mb-1">{{ card.label }}</div>
            <div class="text-sm text-slate-600">{{ card.instruction }}</div>
        </ng-template>
    </div>
</div>
