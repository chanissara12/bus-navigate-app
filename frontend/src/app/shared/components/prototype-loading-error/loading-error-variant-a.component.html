<div class="max-w-xl mx-auto px-4 pt-20 pb-8">
    <div class="flex flex-wrap gap-2 mb-4">
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-sky-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-sky-700"
            (click)="simulateListLoad()"
        >
            จำลองโหลดรายการ
        </button>
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-sky-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-sky-700"
            (click)="simulateCardLoad()"
        >
            จำลองโหลดการ์ด
        </button>
        <button
            type="button"
            class="cursor-pointer rounded-lg bg-red-600 text-white text-xs font-medium px-3 py-1.5 hover:bg-red-700"
            (click)="triggerError()"
        >
            แจ้ง error
        </button>
    </div>

    <div *ngIf="latestError()" class="mb-4 flex items-center justify-between rounded-lg bg-red-100 text-red-800 text-sm px-3 py-2">
        <span>⚠️ {{ latestError() }}</span>
        <button type="button" class="cursor-pointer font-bold px-2" (click)="dismissError()" aria-label="Dismiss error">×</button>
    </div>

    <h3 class="text-sm font-semibold text-slate-500 mb-2">รายการ (list-shaped)</h3>
    <div class="flex flex-col gap-3 mb-6">
        <ng-container *ngIf="listLoading(); else loadedList">
            <div *ngFor="let _ of [1, 2, 3]" class="rounded-2xl border border-slate-200 bg-white p-4 animate-pulse">
                <div class="h-3 w-1/3 rounded bg-slate-200 mb-2"></div>
                <div class="h-3 w-2/3 rounded bg-slate-200 mb-2"></div>
                <div class="h-3 w-1/2 rounded bg-slate-200"></div>
            </div>
        </ng-container>
        <ng-template #loadedList>
            <article *ngFor="let item of listItems" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <div class="text-sm font-medium text-slate-900 mb-1">{{ item.routeNumber }} — {{ item.directionName }}</div>
                <div class="text-sm text-slate-600">🚏 {{ item.boardingStopName }}</div>
            </article>
        </ng-template>
    </div>

    <h3 class="text-sm font-semibold text-slate-500 mb-2">การ์ด (card-shaped)</h3>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center">
        <ng-container *ngIf="cardLoading(); else loadedCard">
            <div class="h-3 w-1/2 rounded bg-slate-200 mx-auto mb-2 animate-pulse"></div>
            <div class="h-3 w-2/3 rounded bg-slate-200 mx-auto animate-pulse"></div>
        </ng-container>
        <ng-template #loadedCard>
            <div class="text-3xl mb-2">{{ card.icon }}</div>
            <div class="text-base font-semibold text-slate-900 mb-1">{{ card.label }}</div>
            <div class="text-sm text-slate-600">{{ card.instruction }}</div>
        </ng-template>
    </div>
</div>
