<p class="mb-3 text-sm font-semibold text-ink-900 dark:text-night-50">การตั้งค่าการเดินทาง</p>

@if (latestError(); as error) {
  <div
    class="flex items-start justify-between gap-2 px-3 py-2 mb-3 text-xs rounded-lg border border-danger-200 bg-danger-50 text-danger-800 dark:border-danger-800 dark:bg-danger-900 dark:text-danger-200"
    role="alert"
    >
    <span>{{ error }}</span>
    <button
      type="button"
      class="flex min-h-11 min-w-11 shrink-0 items-center justify-center rounded-lg px-2 font-semibold cursor-pointer hover:bg-danger-100 focus:outline-none focus:ring-2 focus:ring-danger-300 active:bg-danger-200 dark:hover:bg-danger-800"
      (click)="latestError.set(undefined)"
      >
      ปิด
    </button>
  </div>
}

@if (loading()) {
  <div class="flex flex-col gap-2" aria-label="กำลังโหลดการตั้งค่า">
    <div class="h-12 rounded-xl bg-ink-100 animate-pulse motion-reduce:animate-none dark:bg-night-500"></div>
    <div class="h-12 rounded-xl bg-ink-100 animate-pulse motion-reduce:animate-none dark:bg-night-500"></div>
    <div class="h-12 rounded-xl bg-ink-100 animate-pulse motion-reduce:animate-none dark:bg-night-500"></div>
  </div>
}

@if (!loading()) {
  <div class="flex flex-col gap-2 mb-3">
    <app-toggle-switch
      label="ลดระยะเดิน"
      testId="toggle-minimize-walking"
      [checked]="minimizeWalking()"
      (checkedChange)="minimizeWalking.set($event)"
    ></app-toggle-switch>

    <app-toggle-switch
      label="ลดจำนวนต่อรถ"
      testId="toggle-minimize-transfers"
      [checked]="minimizeTransfers()"
      (checkedChange)="minimizeTransfers.set($event)"
    ></app-toggle-switch>

    <app-toggle-switch
      label="เลี่ยงการข้ามถนน"
      testId="toggle-avoid-street-crossing"
      [checked]="avoidStreetCrossing()"
      (checkedChange)="avoidStreetCrossing.set($event)"
    ></app-toggle-switch>
  </div>

  @if (justSaved()) {
    <div class="px-3 py-2 mb-3 text-xs rounded-lg bg-success-50 text-success-800 dark:bg-success-900 dark:text-success-200" role="status">
      บันทึกการตั้งค่าแล้ว
    </div>
  }

  <button
    type="button"
    data-testid="save-preferences"
    class="w-full px-4 py-2 text-sm font-semibold text-white cursor-pointer rounded-xl bg-success-600 hover:bg-success-700 focus:outline-none focus:ring-2 focus:ring-ink-900 active:bg-success-800 disabled:cursor-not-allowed disabled:bg-ink-300 dark:bg-success-400 dark:text-success-950 dark:hover:bg-success-300 dark:focus:ring-night-50"
    [disabled]="saving()"
    (click)="save()"
    >
    @if (saving()) {
      <span class="inline-flex items-center gap-2">
        <span class="w-4 h-4 border-2 border-white rounded-full animate-spin motion-reduce:animate-none border-t-transparent"></span>
        กำลังบันทึก...
      </span>
    } @else {
      บันทึก
    }
  </button>
}
