@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-ink-900/50 px-4"
    (click)="onCancel()"
    >
    <div
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
      class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-lg"
      (click)="$event.stopPropagation()"
      >
      <h2 class="text-lg font-semibold text-ink-900">{{ title }}</h2>
      <p class="mt-2 text-sm text-ink-600">{{ message }}</p>
      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          data-testid="confirm-dialog-cancel"
          [disabled]="confirming"
          class="cursor-pointer rounded-lg px-4 py-2 text-sm font-medium text-ink-700 hover:bg-ink-100 focus:outline-none focus:ring-2 focus:ring-ink-300 active:bg-ink-200 disabled:cursor-not-allowed disabled:opacity-50"
          (click)="onCancel()"
          >
          {{ cancelLabel }}
        </button>
        <button
          #confirmButton
          type="button"
          data-testid="confirm-dialog-confirm"
          [disabled]="confirming"
          class="cursor-pointer rounded-lg bg-accent-600 px-4 py-2 text-sm font-medium text-white hover:bg-accent-700 focus:outline-none focus:ring-2 focus:ring-accent-400 active:bg-accent-800 disabled:cursor-not-allowed disabled:opacity-50"
          (click)="onConfirm()"
          >
          {{ confirming ? 'กำลังดำเนินการ...' : confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
