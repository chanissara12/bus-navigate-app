<div
    *ngIf="open"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4"
    (click)="onCancel()"
>
    <div
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="title"
        class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-lg"
        (click)="$event.stopPropagation()"
    >
        <h2 class="text-lg font-semibold text-slate-900">{{ title }}</h2>
        <p class="mt-2 text-sm text-slate-600">{{ message }}</p>

        <div class="mt-6 flex justify-end gap-3">
            <button
                type="button"
                data-testid="confirm-dialog-cancel"
                [disabled]="confirming"
                class="cursor-pointer rounded-lg px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-300 active:bg-slate-200 disabled:cursor-not-allowed disabled:opacity-50"
                (click)="onCancel()"
            >
                {{ cancelLabel }}
            </button>
            <button
                type="button"
                data-testid="confirm-dialog-confirm"
                [disabled]="confirming"
                class="cursor-pointer rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400 active:bg-sky-800 disabled:cursor-not-allowed disabled:opacity-50"
                (click)="onConfirm()"
            >
                {{ confirming ? 'กำลังดำเนินการ...' : confirmLabel }}
            </button>
        </div>
    </div>
</div>
