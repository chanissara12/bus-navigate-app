<div class="flex items-center justify-between p-3 border rounded-xl border-ink-200 dark:border-none dark:bg-night-600">
  <span [id]="labelId" class="text-sm text-ink-900 dark:text-night-50">{{ label }}</span>
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked"
    [attr.aria-labelledby]="labelId"
    [attr.data-testid]="testId"
    class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full transition-colors motion-reduce:transition-none focus:outline-none focus:ring-2 focus:ring-accent-400 dark:focus:ring-night-50"
    [class.bg-accent-600]="checked"
    [class.dark:bg-accent-500]="checked"
    [class.bg-ink-300]="!checked"
    [class.dark:bg-night-400]="!checked"
    (click)="onToggle()"
    >
    <span
      class="inline-block w-5 h-5 mt-0.5 ml-0.5 transition-transform motion-reduce:transition-none bg-white rounded-full shadow"
      [class.translate-x-5]="checked"
    ></span>
  </button>
</div>
