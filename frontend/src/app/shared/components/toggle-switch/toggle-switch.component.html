<div class="flex items-center justify-between p-3 border rounded-xl border-slate-200">
  <span class="text-sm text-slate-900">{{ label }}</span>
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="checked"
    [attr.data-testid]="testId"
    class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-sky-400"
    [class.bg-sky-600]="checked"
    [class.bg-slate-300]="!checked"
    (click)="onToggle()"
    >
    <span
      class="inline-block w-5 h-5 mt-0.5 ml-0.5 transition-transform bg-white rounded-full shadow"
      [class.translate-x-5]="checked"
    ></span>
  </button>
</div>
